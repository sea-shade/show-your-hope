name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout site assets
        uses: actions/checkout@v4
        with:
          repository: thelamb/syh-pages
          sparse-checkout: |
            painting_images
            translations
            icons
          sparse-checkout-cone-mode: false
          path: syh-pages

      - name: Copy site assets into public
        run: |
          cp -r syh-pages/painting_images public/painting_images
          cp -r syh-pages/translations public/translations
          cp -r syh-pages/icons public/icons

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
