name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The paintings and translations live in another repository, so a change
  # there needs a run started by hand, or dispatched from that repository.
  workflow_dispatch:
  repository_dispatch:
    types: [assets-updated]

# GITHUB_TOKEN needs to read this repository, write the Pages deployment, and
# mint the OIDC token that deploy-pages authenticates the upload with.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push finish rather than the run it
# replaced - but never cancel a deployment that is already being published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the site assets
        uses: actions/checkout@v7
        with:
          repository: sea-shade/syh-data
          sparse-checkout: |
            painting_images
            translations
            icons
          sparse-checkout-cone-mode: false
          path: syh-data

      - name: Move the site assets into public/
        run: |
          mv syh-data/painting_images public/painting_images
          mv syh-data/translations public/translations
          mv syh-data/icons public/icons
          rm -rf syh-data

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build
        # Pages serves the site from /<repository>/, so Vite and the router
        # need that prefix. A custom domain would make this '/'.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
